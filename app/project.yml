name: yume
options:
  bundleIdPrefix: ai.yume
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Starscream:
    url: https://github.com/daltoniam/Starscream
    from: "4.0.6"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: ""
    PRODUCT_BUNDLE_IDENTIFIER: ai.yume.app

targets:
  yume:
    type: application
    platform: macOS
    sources:
      - path: Sources/yume
    resources:
      - path: Resources
        optional: true
    dependencies:
      - package: Starscream
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: yume
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "Copyright © 2026 yume contributors. MIT License."
        NSMicrophoneUsageDescription: "yume listens through the microphone when you hold Right Option, transcribes your speech with Gradium, and sends it to the assistant."
        NSAppleEventsUsageDescription: "yume coordinates background work through Hermes Agent's computer_use tool."
        NSCameraUsageDescription: "Optional. yume only uses the camera when the gaze stretch feature is explicitly enabled (not in this build)."
    entitlements:
      path: yume.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.device.microphone: true
        com.apple.security.network.client: true
        com.apple.security.automation.apple-events: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: ["@executable_path/../Frameworks"]
